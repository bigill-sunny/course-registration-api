name: Course API CI
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt black==26.10.1 pytest pytest-cov httpx
      - name: Lint with Black
        run: python -m black --check main.py parser.py students.py audit.py tests
      - name: Pytest coverage (minimum 80%)
        run: python -m pytest -v tests --cov=main --cov=parser --cov=students --cov=audit --cov-report=term-missing --cov-fail-under=80
      - name: Integration tests against Uvicorn
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          server=$!
          trap 'cat uvicorn.log; kill "$server" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/
          API_URL=http://127.0.0.1:8000 python -m pytest -v tests
